name: Release

on:
  push:
    tags:
      - "v*.*.*" # Triggers on any version tag: v0.3.0, v1.0.0, etc.

permissions:
  contents: write # Required to create GitHub Releases

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout full history so we can diff tags for changelog ──────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Read version from package.json ───────────────────────────────────
      - name: Read version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      # ── 3. Extract changelog from CHANGELOG.md ──────────────────────────────
      - name: Extract release notes
        id: changelog
        run: |
          # Remove 'v' prefix if present for matching CHANGELOG.md format (e.g. v0.4.7 -> 0.4.7)
          VERSION_NO_V=$(echo "${GITHUB_REF_NAME}" | sed 's/^v//')
          
          # Extract the section for the specific version using awk
          # We use index() to avoid regex bracket escaping issues for the start string
          awk -v ver="## [$VERSION_NO_V]" '
            index($0, ver) == 1 {flag=1; next}
            /^## \[/ {if(flag) exit}
            flag {print}
          ' CHANGELOG.md > changelog.md

          # If changelog is empty (e.g. no entry found), add a fallback
          if [ ! -s changelog.md ]; then
            echo "No release notes found in CHANGELOG.md for version $VERSION_NO_V." > changelog.md
          fi

          # Append static footer
          cat >> changelog.md << 'EOF'

          ---
          ### 📦 Install

          ```bash
          npm install @manasdb/core
          ```

          ### 📖 Resources
          - [README](https://github.com/${{ github.repository }}#readme)
          - [GitHub Discussions](https://github.com/${{ github.repository }}/discussions)
          - [NPM Package](https://www.npmjs.com/package/@manasdb/core)
          EOF

          echo "body<<EOF" >> $GITHUB_OUTPUT
          cat changelog.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # ── 4. Detect if this is a pre-release (e.g. v0.x.x or tag has -alpha/-beta) ──
      - name: Detect pre-release
        id: prerelease
        run: |
          TAG=${GITHUB_REF_NAME}
          if echo "$TAG" | grep -qE '(-alpha|-beta|-rc|^v0\.)'; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      # ── 5. Create the GitHub Release ────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "@manasdb/core v${{ steps.pkg.outputs.version }}"
          body: ${{ steps.changelog.outputs.body }}
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          draft: false
          generate_release_notes: false # We supply our own above
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
