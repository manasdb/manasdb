[package]
name = "cognitive"
version = "0.1.0"
edition = "2024"

[dependencies]
pipeline = { path = "../pipeline" }
runtime = { path = "../runtime" }
async-trait = "0.1"
thiserror = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1.30", features = ["macros", "rt-multi-thread"] }
serde_json = "1.0"
